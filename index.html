<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VellumNotes Web</title>
<style>
:root{--bg:#F8FAFC;--ink:#0F172A;--bd:#CBD5E1;--hv:#E2E8F0;--w:#fff;--soft:#F1F5F9;--pri:#2563EB;--priH:#1D4ED8;--sl:#334155;--m:#64748B;--chk:#DBEAFE;--acc:#60A5FA}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hide{display:none!important}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg circle.f{fill:currentColor}.st.on{fill:#F59E0B;stroke:#D97706}
small,h4{color:var(--m);font-size:11px;font-weight:700}
#home{display:flex;height:100vh}
aside{width:236px;background:var(--ink);color:var(--bg);padding:20px 14px;display:flex;flex-direction:column;gap:5px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:16px}.brand b{display:block;font-size:17px;font-weight:800}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#60A5FA,#2563EB);display:grid;place-items:center;font-weight:800;font-size:20px}
.nb{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;color:#94A3B8;font-size:13px;font-weight:600;text-align:left;width:100%}
.nb:hover{background:#172033;color:#fff}.nb.on{background:#1E293B;color:var(--acc)}.nb span{margin-left:auto;font-size:11px}
.fh{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.fh button{width:24px;height:24px;border-radius:12px;background:#1E293B;color:var(--bd)}
main{flex:1;padding:24px 28px;overflow:auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px;font-weight:800}
.row{display:flex;gap:10px;align-items:center}
#srch{flex:1;max-width:420px;height:38px;border:1px solid var(--bd);border-radius:19px;padding:0 16px;font-size:13px;background:var(--w);outline:0;user-select:text}
#srch:focus{border:2px solid var(--pri)}
.fab{width:42px;height:42px;border-radius:21px;background:var(--pri);color:#fff;display:grid;place-items:center;margin-left:auto;box-shadow:0 3px 14px rgba(37,99,235,.35)}.fab:hover{background:var(--priH)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px}
.card{background:var(--w);border:1px solid var(--hv);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;transition:.12s}
.card:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,42,.08)}
.cov{border-top:5px solid var(--c);background:var(--soft);aspect-ratio:1.45;display:grid;place-items:center;overflow:hidden}.cov canvas{width:100%;height:100%;object-fit:cover}
.card .i{padding:9px 12px}.card b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st,.card .dt{position:absolute;top:9px;background:#fffd;border-radius:50%;padding:2px;width:22px;height:22px;color:#94A3B8}.card .st{right:6px}.card .dt{left:6px}
.recs{display:flex;gap:10px;flex-wrap:wrap}.rc{background:var(--w);border:1px solid var(--hv);border-radius:12px;padding:10px 14px;border-left:6px solid var(--c);text-align:left;min-width:150px}.rc:hover{border-color:var(--acc)}.rc b{display:block;font-size:13px}
#empty{border:1px dashed var(--bd);border-radius:14px;background:var(--w);padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
#empty .logo{width:64px;height:64px;font-size:32px}#empty h3{font-size:20px}#empty p{color:var(--m);font-size:13px;max-width:360px}
.pri{background:var(--pri);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px}.pri:hover{background:var(--priH)}
.gh{background:var(--soft);color:var(--sl);border:1px solid var(--hv);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}.gh:hover{background:var(--hv)}
#binbar{background:#FEF3C7;border:1px solid #FDE68A;border-radius:10px;padding:8px 12px;color:#78350F;font-size:12px;display:flex;gap:10px;align-items:center}
#ed{position:fixed;inset:0}
#cv{display:block;width:100%;height:100%;touch-action:none;background:#E5E8EF}
.bar{position:fixed;background:var(--w);border:1px solid var(--bd);display:flex;align-items:center;gap:4px;z-index:50}
#top{left:10px;top:50%;transform:translateY(-50%);flex-direction:column;border-radius:18px;padding:8px 5px;flex-wrap:nowrap;justify-content:flex-start;max-height:96vh;overflow-y:auto;scrollbar-width:none;box-shadow:4px 6px 24px rgba(15,23,42,.09)}
#top::-webkit-scrollbar{display:none}
.b{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#334155;flex:none;position:relative;transition:background .12s,color .12s,box-shadow .12s}.b:hover{background:var(--soft);color:var(--ink)}
.b.on{background:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.32)}
.b.grp::before{content:'';position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--cc,#0F172A);border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(15,23,42,.25)}
.b.grp::after{content:'';position:absolute;right:3px;bottom:3px;width:0;height:0;border-style:solid;border-width:0 0 6px 6px;border-color:transparent transparent currentColor transparent;opacity:.5}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.sp{width:22px;height:1px;background:var(--hv);margin:4px 0;flex:none}
#ttlbar{top:14px;left:50%;transform:translateX(-50%);border-radius:14px;padding:3px;max-width:min(46vw,520px)}
#ttl{display:flex;align-items:center;gap:8px;max-width:100%;padding:6px 12px;border-radius:11px;font-size:14px;font-weight:800;color:var(--ink);background:none}
#ttl:hover{background:var(--soft)}
#ttl .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ttl svg{width:14px;height:14px;color:var(--m);flex:none}

/* Paleta de colores separada (columna vertical a la izquierda de la barra derecha) */
#pal{right:66px;top:50%;transform:translateY(-50%);flex-direction:column;border-radius:16px;padding:10px 6px;gap:7px;max-height:92vh;box-shadow:-4px 4px 18px rgba(15,23,42,.07);z-index:48}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd);transition:transform .1s;flex:none}.sw:hover{transform:scale(1.12)}.sw.on{box-shadow:0 0 0 2.5px var(--pri)}
.cp-ring{position:relative;width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--bd);cursor:pointer;display:inline-block;flex:none;transition:transform .1s}
.cp-ring:hover{transform:scale(1.12);box-shadow:0 0 0 2px var(--pri)}
.cp-ring input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
input[type=color]{width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer}
input[type=range]{width:76px;accent-color:var(--pri);cursor:pointer}
#pal .v-range,#sub .v-range{writing-mode:vertical-lr;direction:rtl;width:20px;height:74px;padding:0;margin:2px 0}

/* Submenú de cada herramienta: tarjeta con secciones */
#sub{left:66px;top:50%;transform:translateY(-50%);flex-direction:column;align-items:stretch;justify-content:flex-start;width:190px;border-radius:18px;padding:12px;gap:12px;font-size:12px;flex-wrap:nowrap;max-height:92vh;overflow-y:auto;scrollbar-width:thin;box-shadow:6px 8px 28px rgba(15,23,42,.12);z-index:49}
#sub button{border:1px solid var(--hv);background:var(--w);color:var(--sl);border-radius:9px;padding:6px 8px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background .12s,border-color .12s,color .12s}
#sub button svg{width:17px;height:17px}
#sub button:hover{background:var(--soft)}
#sub button.on{background:var(--chk);border-color:#BFDBFE;color:var(--priH)}
#sub .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:-2px}
#sub .hd b{font-size:13px;font-weight:800;color:var(--ink)}
#sub .cls{width:22px;height:22px;padding:0;border-radius:50%;border:0;background:var(--soft);color:var(--m);font-size:11px;font-weight:700}
#sub .cls:hover{background:var(--hv);color:var(--ink)}
#sub .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--soft);padding:3px;border-radius:12px}
#sub .tabs button{flex-direction:column;gap:2px;padding:6px 0 5px;border:0;background:none;font-size:10.5px;font-weight:700;color:var(--m)}
#sub .tabs button svg{width:20px;height:20px}
#sub .tabs button:hover{background:#fff8;color:var(--ink)}
#sub .tabs button.on{background:var(--w);color:var(--priH);box-shadow:0 1px 4px rgba(15,23,42,.14)}
#sub .prev{height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;padding:0 14px;overflow:hidden}
#sub .prev span{display:block;width:100%}
#sub .sec{display:flex;flex-direction:column;gap:7px}
#sub .sec>small{letter-spacing:.2px}
#sub .sg{display:flex;gap:4px}
#sub .sg button{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:10.5px}
#sub .sg.g2{display:grid;grid-template-columns:1fr 1fr}
#sub .sg.g2 button{flex-direction:row;justify-content:flex-start;padding:6px 8px;font-size:11.5px}
#sub .sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#sub .sgrid button{padding:6px 0}
#sub .pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 0;justify-items:center}
#sub .pal button{width:24px;height:24px;min-width:0;min-height:0;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd)}
#sub .pal button:hover{transform:scale(1.1)}
#sub .pal button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pri)}
#sub .cp-ring.cust{background:conic-gradient(#EF4444,#F59E0B,#10B981,#06B6D4,#2563EB,#8B5CF6,#EC4899,#EF4444)}
#sub .cp-ring.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pri)}
#sub .rg{display:flex;flex-direction:column;gap:4px}
#sub .rg .lb{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--m)}
#sub .rg .lb span{display:flex;align-items:center;gap:5px}
#sub .rg .lb svg{width:15px;height:15px}
#sub .rg .val{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
#sub input[type=range]{width:100%}
#sub .tg{width:100%;justify-content:flex-start;padding:7px 9px}
#sub .tg.on{background:var(--w);border-color:var(--hv);color:var(--ink)}
.swt{margin-left:auto;width:26px;height:15px;border-radius:8px;background:var(--bd);position:relative;transition:background .15s;flex:none}
.swt::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s}
.on>.swt{background:var(--pri)}.on>.swt::after{left:13px}
#sub .frow{display:flex;align-items:center;gap:10px}
#sub .hint{font-size:11.5px;color:var(--m);line-height:1.45}

#bot{bottom:14px;right:18px;border-radius:14px;padding:6px 10px;gap:8px;font-size:12px;font-weight:700}#bot button{background:var(--soft);border-radius:8px;padding:5px 9px;font-weight:700}#bot button:hover{background:var(--hv)}
#bot .sp{width:1px;height:22px;margin:0 4px}
#pp{position:fixed;left:66px;top:14px;bottom:14px;width:168px;background:var(--w);border:1px solid var(--bd);border-radius:14px;z-index:40;display:flex;flex-direction:column;padding:10px;gap:8px}
#pl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}#pl div{border:2px solid var(--hv);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}#pl div.on{border-color:var(--pri)}#pl canvas{width:100%;display:block}#pl small{position:absolute;bottom:2px;right:5px;background:#fffc;border-radius:6px;padding:0 5px}
#pp .r{display:flex;gap:6px}#pp .r button{flex:1;background:var(--soft);border-radius:8px;padding:6px;font-size:12px;font-weight:600}
#tx{position:fixed;display:none;z-index:60;background:#fffe;border:2px solid #38BDF8;border-radius:8px;padding:6px 8px;font-size:18px;outline:0;resize:both;min-width:180px;min-height:42px;user-select:text}
.spop{position:fixed;display:none;z-index:85;background:var(--w);border:1px solid var(--bd);border-radius:14px;padding:5px 8px;align-items:center;gap:5px;box-shadow:0 8px 24px rgba(15,23,42,.14);font-size:12px;font-weight:600;color:var(--sl);max-width:95vw;flex-wrap:wrap}
.spop button{border:1px solid transparent;background:var(--bg);color:var(--sl);border-radius:8px;width:30px;height:30px;padding:0;display:grid;place-items:center}
.spop button svg{width:17px;height:17px}
.spop button:hover{background:var(--soft);color:var(--ink);border-color:var(--hv)}
.spop button.on{background:var(--chk);color:var(--priH);border-color:#BFDBFE}
.spop button.dng{color:#DC2626}.spop button.dng:hover{background:#FEE2E2;color:#B91C1C}
.spop .vsp{width:1px;height:18px;background:var(--hv);margin:0 2px}
.menu{position:fixed;z-index:200;background:var(--w);border:1px solid var(--hv);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 8px 28px rgba(15,23,42,.14);font-size:13px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:8px}.menu button svg{width:17px;height:17px;color:var(--m)}.menu button:hover svg{color:inherit}.menu .dng svg{color:inherit}.menu kbd{margin-left:auto;padding-left:14px;font:inherit;font-size:11px;color:var(--m)}.menu button:hover{background:#EFF6FF;color:var(--priH)}.menu .dng{color:#DC2626}
.menu hr{border:0;height:1px;background:var(--hv);margin:4px 8px}.menu .sw{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;border:0;box-shadow:none;border-radius:0;width:auto;height:auto}.menu .sw button{width:20px;height:20px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd)}
.ov{position:fixed;inset:0;background:#0F172A66;z-index:300;display:grid;place-items:center}
.mod{background:var(--w);border-radius:16px;padding:20px 22px;width:min(380px,92vw);display:flex;flex-direction:column;gap:10px;font-size:13px}.mod h3{font-size:17px}
.crop-mod{width:min(640px,94vw)}
.crop-wrap{position:relative;background:#0F172A;border-radius:12px;overflow:hidden;display:grid;place-items:center;max-height:62vh;padding:12px}
.crop-box{position:relative;display:inline-block;line-height:0}
.crop-box img{display:block;max-width:100%;max-height:56vh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.crop-rect{position:absolute;border:2px solid #38BDF8;background:rgba(56,189,248,0.16);box-shadow:0 0 0 9999px rgba(15,23,42,0.52);cursor:move;touch-action:none}
.crop-h{position:absolute;width:12px;height:12px;border-radius:50%;background:#FFFFFF;border:2px solid #2563EB;transform:translate(-50%,-50%);touch-action:none}
.crop-h.tl{left:0;top:0;cursor:nwse-resize}.crop-h.tr{left:100%;top:0;cursor:nesw-resize}
.crop-h.br{left:100%;top:100%;cursor:nwse-resize}.crop-h.bl{left:0;top:100%;cursor:nesw-resize}
.crop-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.mod label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}.mod select{padding:5px 8px;border:1px solid var(--bd);border-radius:8px}.mod td{padding:3px 6px}
/* ---------- Móvil y tableta ---------- */
html,body{overscroll-behavior:none}
body{height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none}
#home{height:100dvh}
#srch,#tx{-webkit-user-select:text}
@media (pointer:coarse){
 .b{width:42px;height:42px}
 input[type=range]{height:28px}
 #sub button,#sub .tg{min-height:34px}
 .spop button{width:34px;height:34px}
 .menu button{padding:11px 12px}
}
body.cmp #top{left:0;right:0;top:auto;bottom:0;transform:none;flex-direction:row;border-radius:16px 16px 0 0;border-width:1px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));max-height:none;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;gap:4px;box-shadow:0 -4px 18px rgba(15,23,42,.1)}
body.cmp #top .b{width:42px;height:42px}
body.cmp #top .sp{width:1px;height:24px;margin:0 3px}
body.cmp #ttlbar{top:calc(6px + env(safe-area-inset-top));max-width:calc(100vw - 24px)}
body.cmp #ttl{padding:5px 12px;font-size:13px}
body.cmp #bot{top:calc(46px + env(safe-area-inset-top));bottom:auto;left:8px;right:8px;justify-content:center;border-radius:14px;padding:4px 8px;gap:6px;font-size:11.5px}
body.cmp #bot #zo,body.cmp #bot #zi{display:none}
body.cmp #sub:not(.hide){display:grid}
body.cmp #sub{left:8px;right:8px;width:auto;top:auto;bottom:calc(68px + env(safe-area-inset-bottom));transform:none;max-height:40vh;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 14px;align-items:start;border-radius:16px}
body.cmp #sub .hd,body.cmp #sub .tabs,body.cmp #sub .prev,body.cmp #sub .hint{grid-column:1/-1}
body.cmp #pp{left:8px;right:8px;top:auto;bottom:calc(68px + env(safe-area-inset-bottom));width:auto;height:150px;flex-direction:row;align-items:stretch}
body.cmp #pl{flex-direction:row;overflow-x:auto;overflow-y:hidden}
body.cmp #pl div{flex:none;width:96px}
body.cmp #pp .r{flex-direction:column;justify-content:center;width:86px}
body.cmp .spop{max-width:calc(100vw - 16px)}
body.cmp #home{flex-direction:column}
body.cmp aside{width:100%;flex:none;flex-direction:row;align-items:center;gap:6px;padding:10px 12px;overflow-x:auto;overflow-y:hidden}
body.cmp aside #nav,body.cmp aside #fl{display:contents}
body.cmp aside .brand{margin:0 8px 0 0;flex:none}
body.cmp aside .brand small,body.cmp aside>small,body.cmp .fh small{display:none}
body.cmp aside>div[style*="flex:1"]{display:none}
body.cmp .nb{width:auto;flex:none;height:38px;padding:0 12px}
body.cmp .fh{margin:0;flex:none}
body.cmp main{padding:14px 14px 40px;min-height:0}
body.cmp h1{font-size:22px}
body.cmp #grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
</style></head><body>
<div id="home">
<aside><div class="brand"><div class="logo">V</div><div><b>VellumNotes</b><small>Tus apuntes a mano</small></div></div>
<div id="nav"></div>
<div class="fh"><small>CARPETAS</small><button id="nf" title="Nueva carpeta">+</button></div><div id="fl"></div>
<div style="flex:1"></div><button class="nb" id="hh">Ayuda (F1)</button><small>Autoguardado activado</small></aside>
<main><small id="greet"></small><h1 id="ht">Documentos</h1><small id="hs"></small>
<div class="row"><input id="srch" placeholder="Buscar notas…  (Ctrl+F)"><button class="fab" id="add" title="Nueva nota o abrir .json"></button></div>
<div id="binbar" class="hide"><span style="flex:1">Restaura o elimina de forma permanente.</span><button class="gh" id="emp">Vaciar papelera</button></div>
<div id="rec" class="hide"><h4>RECIENTES</h4><div class="recs" id="recs"></div></div>
<h4 id="gh" class="hide">TODOS LOS DOCUMENTOS</h4>
<div id="grid"></div>
<div id="empty" class="hide"><div class="logo">V</div><h3 id="et"></h3><p id="ep"></p><button class="pri" id="en">+ Crear mi primera nota</button></div>
</main></div>
<div id="ed" class="hide">
<canvas id="cv"></canvas>
<div class="bar" id="top"></div>
<div class="bar hide" id="sub"></div>
<div id="pp" class="hide"><div id="pl"></div><div class="r"><button id="pd">Duplicar</button><button id="px">Eliminar</button></div></div>
<div class="bar" id="ttlbar"><button id="ttl" title="Renombrar la nota"></button></div>
<div class="bar" id="bot"><button id="pv">◀</button><span id="pi"></span><button id="nx">▶</button><button id="np">+ Página</button><div class="sp"></div><button id="zo">−</button><span id="zl"></span><button id="zi">+</button><button id="zc">Centrar</button></div>
<div class="spop" id="spop"></div>
<textarea id="tx" placeholder="Escribe… (toca o haz clic fuera para fijar)"></textarea>
</div>
<input type="file" id="fj" accept=".json" class="hide"><input type="file" id="fi" accept="image/*" class="hide">

/* ---------- ayuda de marcas milimétricas (mm) ---------- */
function drawMmSegment(c, x1, y1, x2, y2, nx, ny, totalMm, stepMm, fontSize=9){
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  if (len < 12) return;
  const ux = dx / len, uy = dy / len;
  c.save();
  c.strokeStyle = '#2563EB';
  c.fillStyle = '#1D4ED8';
  c.lineWidth = 1.0;
  c.font = `600 ${fontSize}px Segoe UI`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  for (let mm = 0; mm <= totalMm; mm += stepMm){
    const t = mm / totalMm;
    const bx = x1 + ux * len * t, by = y1 + uy * len * t;
    const isMajor = (mm % 10 === 0);
    const isMid = (mm % 5 === 0);
    const tickLen = isMajor ? 14 : (isMid ? 9 : 5);
    c.beginPath();
    c.moveTo(bx, by);
    c.lineTo(bx + nx * tickLen, by + ny * tickLen);
    c.stroke();
    if (isMajor && mm > 0 && mm < totalMm){
      c.fillText(String(mm / 10), bx + nx * (tickLen + 7), by + ny * (tickLen + 7));
    }
  }
  c.restore();
}

function tpl(c,p){const s=p.spacing,W=p.width,H=p.height,dk=p.bg=='#0F172A',lc=dk?'#1E293B':'#E2E8F0',L=(a,b,e,f)=>{c.moveTo(a,b);c.lineTo(e,f)};
 if(p.style=='blank')return;c.save();c.strokeStyle=c.fillStyle=lc;c.lineWidth=1;c.beginPath();
 if(p.style=='grid'||p.style=='engineering'){for(let x=s;x<W;x+=s)L(x,0,x,H);for(let y=s;y<H;y+=s)L(0,y,W,y);c.stroke();
  if(p.style=='engineering'){c.strokeStyle=dk?'#334155':'#CBD5E1';c.beginPath();for(let x=s*5;x<W;x+=s*5)L(x,0,x,H);for(let y=s*5;y<H;y+=s*5)L(0,y,W,y);c.stroke()}}
 else if(p.style=='lined'){for(let y=s*2;y<H-s;y+=s)L(0,y,W,y);c.stroke();c.strokeStyle='#FCA5A5';c.beginPath();L(68,0,68,H);c.stroke()}
 else if(p.style=='dotted'){for(let y=s;y<H;y+=s)for(let x=s;x<W;x+=s){c.beginPath();c.arc(x,y,1.5,0,7);c.fill()}}
 else if(p.style=='music'){c.strokeStyle=dk?'#475569':'#94A3B8';for(let y=s*2;y<H-s*2;y+=s*3.2)for(let k=0;k<5;k++)L(40,y+k*s*.5,W-40,y+k*s*.5);c.stroke()}
 c.restore()}

function chalk(c,P,s){
 const t=s.thickness,u=Math.max(.7,t*.14),a=s.opacity;
 const path=()=>{c.beginPath();c.moveTo(P[0].x,P[0].y);for(let i=1;i<P.length-1;i++)c.quadraticCurveTo(P[i].x,P[i].y,(P[i].x+P[i+1].x)/2,(P[i].y+P[i+1].y)/2);c.lineTo(P[P.length-1].x,P[P.length-1].y)};
 c.lineCap='butt';c.lineJoin='round';
 c.globalAlpha=a*.22;c.lineWidth=t*.75;path();c.stroke();
 [[-.3,.2,[1,2.3,.6,1.8],0],[.3,-.2,[.8,1.5,2,.7],1.1],[.2,.3,[1.6,.9,.5,2.6],.5],[-.2,-.3,[.6,1.9,1.1,1.4],1.7],[0,0,[1.2,1.1,.4,2.2],.9]].forEach(([ox,oy,d,ph])=>{
  c.save();c.translate(ox*t*.5,oy*t*.5);c.setLineDash(d.map(x=>x*u));c.lineDashOffset=ph*u;c.globalAlpha=a*.85;c.lineWidth=Math.max(1,t*.34);path();c.stroke();c.restore()});
}
function stroke(c,s,bg){const P=s.points;if(!P.length)return;c.save();const k=ink(s.color,bg);c.strokeStyle=c.fillStyle=k;c.globalAlpha=s.opacity;c.lineWidth=s.thickness;c.lineCap=s.cap||'round';c.lineJoin='round';
 if(s.dash=='dotted')c.setLineDash([.1,s.thickness*2.2]);else if(s.dash=='dashed')c.setLineDash([s.thickness*4,s.thickness*2.5]);
 if(s.kind=='glow'){c.shadowColor=k;c.shadowBlur=s.thickness*3}if(s.kind=='water'){c.globalAlpha=s.opacity*.28;c.lineWidth=s.thickness*2.6}
 if(P.length==1){c.beginPath();c.arc(P[0].x,P[0].y,s.thickness/2,0,7);c.fill()}
 else if(s.nib=='calli'){for(let i=1;i<P.length;i++){const a=Math.atan2(P[i].y-P[i-1].y,P[i].x-P[i-1].x);c.lineWidth=s.thickness*(.3+.9*Math.abs(Math.sin(a-.8)));c.beginPath();c.moveTo(P[i-1].x,P[i-1].y);c.lineTo(P[i].x,P[i].y);c.stroke()}}
 else if(s.kind=='chalk'){chalk(c,P,s)}
 else{c.beginPath();c.moveTo(P[0].x,P[0].y);for(let i=1;i<P.length-1;i++)c.quadraticCurveTo(P[i].x,P[i].y,(P[i].x+P[i+1].x)/2,(P[i].y+P[i+1].y)/2);c.lineTo(P[P.length-1].x,P[P.length-1].y);c.stroke()}
 c.restore()}

function poly(t,x,y,w,h,f,g){const m=x+w/2,n=y+h/2;if(t=='parabola')return Array.from({length:61},(_,i)=>{const u=-1+i/30;return[m+u*w/2,f?y+h*u*u:y+h*(1-u*u)]});if(t=='triangle'||t=='tri_r'){let P=t=='triangle'?[[m,y],[x+w,y+h],[x,y+h]]:[[x,y],[x,y+h],[x+w,y+h]];if(f)P=P.map(q=>[q[0],2*n-q[1]]);if(g)P=P.map(q=>[2*m-q[0],q[1]]);return P}if(t=='diamond')return[[m,y],[x+w,n],[m,y+h],[x,n]];
 const q=t=='hexagon'?6:t=='star'?10:5;return Array.from({length:q},(_,i)=>{const r=t=='star'&&i%2?.4:1,a=-Math.PI/2+i*2*Math.PI/q;return[m+Math.cos(a)*w/2*r,n+Math.sin(a)*h/2*r]})}

function arrow(c,x1,y1,x2,y2,t){const a=Math.atan2(y2-y1,x2-x1),l=Math.max(12,t*3.5);c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-l*Math.cos(a-.5),y2-l*Math.sin(a-.5));c.lineTo(x2-l*Math.cos(a+.5),y2-l*Math.sin(a+.5));c.closePath();c.fill()}

function rotPt(pt,cx0,cy0,deg){
  if(!deg)return{x:pt.x,y:pt.y};
  const a=deg*Math.PI/180,dx=pt.x-cx0,dy=pt.y-cy0;
  return{x:cx0+dx*Math.cos(a)-dy*Math.sin(a),y:cy0+dx*Math.sin(a)+dy*Math.cos(a)};
}
function rotBox(x,y,w,h,deg){
  if(!deg||Math.abs(deg%360)<1e-4)return{x,y,w,h};

function drawGeoInstrument(c, g){
  c.save();
  c.translate(g.x, g.y);
  c.rotate(g.a);
  c.strokeStyle = '#2563EB';
  c.fillStyle = 'rgba(248, 250, 252, 0.92)';
  c.lineWidth = 1.4;

  if (g.k === 'ruler'){
    c.fillRect(0, 0, RL, 64);
    c.strokeRect(0, 0, RL, 64);
    drawMmSegment(c, 0, 0, RL, 0, 0, 1, 200, 1, 9);
    drawMmSegment(c, 0, 64, RL, 64, 0, -1, 200, 1, 9);
  } else if (g.k === 'protractor'){
    // Transportador semicircular 180° con centro en (PR, PR)
    const cx0 = PR, cy0 = PR;
    c.beginPath();
    c.moveTo(cx0 - PR, cy0);
    c.arc(cx0, cy0, PR, Math.PI, 0, false);
    c.closePath();
    c.fill();
    c.stroke();
    // Base recta con mm
    drawMmSegment(c, cx0 - PR + 14, cy0, cx0 + PR - 14, cy0, 0, -1, 80, 1, 8);
    // Graduación 0° a 180°
    c.strokeStyle = '#2563EB';
    c.fillStyle = '#1D4ED8';
    c.font = '600 9px Segoe UI';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    for (let deg = 0; deg <= 180; deg += 2){
      const rad = Math.PI - (deg * Math.PI / 180);
      const isTen = deg % 10 === 0;
      const isFive = deg % 5 === 0;
      const tick = isTen ? 14 : (isFive ? 9 : 5);
      const xOuter = cx0 + Math.cos(rad) * PR;
      const yOuter = cy0 - Math.sin(rad) * PR;
      const xInner = cx0 + Math.cos(rad) * (PR - tick);
      const yInner = cy0 - Math.sin(rad) * (PR - tick);
      c.beginPath(); c.moveTo(xOuter, yOuter); c.lineTo(xInner, yInner); c.stroke();
      if (isTen){
        const lx = cx0 + Math.cos(rad) * (PR - 24);
        const ly = cy0 - Math.sin(rad) * (PR - 24);
        c.fillText(String(deg) + '°', lx, ly);
      }
    }
    // Marca central de 90° y origen
    c.beginPath(); c.arc(cx0, cy0, 4, 0, 7); c.fill();
  } else {
    // Escuadra triangular con escala en mm en los 3 lados
    const p0 = {x:0, y:0}, p1 = {x:TLN, y:0}, p2 = {x:0, y:TLN};
    c.beginPath(); c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y); c.lineTo(p2.x, p2.y); c.closePath();
    c.fill(); c.stroke();
    // Lado horizontal superior (0 -> TLN): interior hacia abajo (+y)
    drawMmSegment(c, 12, 0, TLN - 12, 0, 0, 1, 70, 1, 8);
    // Lado vertical izquierdo (0 -> TLN): interior hacia derecha (+x)
    drawMmSegment(c, 0, 12, 0, TLN - 12, 1, 0, 70, 1, 8);
    // Hipotenusa ((TLN,0) -> (0,TLN)): interior hacia arriba-izquierda (-1/sqrt2, -1/sqrt2)
    const invS = 1 / Math.SQRT2;
    drawMmSegment(c, TLN - 14, 14, 14, TLN - 14, -invS, -invS, 100, 1, 8);
  }
  c.restore();
}

function undo(){const p=pg();if(!p._u||!p._u.length)return;(p._r=p._r||[]).push(state(p));put(p,p._u.pop())}

function pasteSelection(dx=24, dy=24){
  if(!clip||!clip.length)return;
  snap();
  const p=pg(), clones=[];
  for(const it of clip){
    const c=JSON.parse(JSON.stringify(it,R));
    c.locked=false;
    mv(c,dx,dy);
    const k=c.points?'strokes':c.src?'images':c.text!==undefined?'texts':'shapes';
    p[k].push(c);
    clones.push(c);
  }
  sel=clones; selAngle=0;
  touch(); sub(); render();
}
function alignSelection(mode){
  if(sel.length<2)return;
  const movable=sel.filter(it=>!(it&&it.src&&it.locked));
  if(movable.length<2)return;
  snap();
  let x0=Infinity,x1=-Infinity;
  movable.forEach(it=>{const b=bnd(it);x0=Math.min(x0,b.x);x1=Math.max(x1,b.x+b.w);});
  const cxAll=(x0+x1)/2;
  movable.forEach(it=>{
    const b=bnd(it);
    let deltaX=0;
    if(mode==='L')deltaX=x0-b.x;
    else if(mode==='C')deltaX=cxAll-(b.x+b.w/2);
    else if(mode==='R')deltaX=x1-(b.x+b.w);
    if(deltaX)mv(it,deltaX,0);
  });
}
function selAct(a, live=false){
 if(a==='paste'){pasteSelection(24,24);return;}
 if(!sel.length)return;
 if(a==='crop'){if(sel.length===1&&sel[0]&&sel[0].src&&!sel[0].locked)openCropModal(sel[0]);return;}
 if(!live || Date.now()-_colSnapT>700){snap();_colSnapT=Date.now();}
 const p=pg();
 if(a==='lock'){
   const imgs=sel.filter(it=>it&&it.src);
   if(!imgs.length)return;
   const targetState=!imgs.every(im=>im.locked);
   imgs.forEach(im=>im.locked=targetState);
   if(targetState && !selLocked){
     if(sel.length>imgs.length) sel=sel.filter(it=>!(it&&it.src&&it.locked));
   }
 }
 else if(a==='rot90'){
   const sb=selBox();
   if(sb){
     const orig=JSON.parse(JSON.stringify(sel,R));
     rotateSelectionItems(orig,sb.cx,sb.cy,90);
     selAngle=(selAngle+90)%360;
   }
 }
 else if(a==='front'){
   ['images','shapes','strokes','texts'].forEach(k=>{
     const sPart=p[k].filter(x=>sel.includes(x));
     const oPart=p[k].filter(x=>!sel.includes(x));
     p[k]=[...oPart,...sPart];

/* ---------- geometría ---------- */
function loc(pt){const c=Math.cos(geo.a),s=Math.sin(geo.a),dx=pt.x-geo.x,dy=pt.y-geo.y;return{x:dx*c+dy*s,y:-dx*s+dy*c,c,s}}
function hitGeo(pt){
  const l=loc(pt);
  if(geo.k=='ruler') return l.x>=0&&l.x<=RL&&l.y>=0&&l.y<=64;
  if(geo.k=='protractor') return l.x>=0&&l.x<=PR*2&&l.y>=0&&l.y<=PR;
  return l.x>=0&&l.y>=0&&l.x+l.y<=TLN;
}
function toWorldFromLocal(lx, ly){
  return {
    x: geo.x + lx * Math.cos(geo.a) - ly * Math.sin(geo.a),
    y: geo.y + lx * Math.sin(geo.a) + ly * Math.cos(geo.a)
  };
}

function projectToSegmentLocal(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1, len2 = dx * dx + dy * dy;
  if (len2 < 1e-9) return { x: x1, y: y1, dist: Math.hypot(px - x1, py - y1) };
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  const sx = x1 + t * dx, sy = y1 + t * dy;
  return { x: sx, y: sy, dist: Math.hypot(px - sx, py - sy) };
}

function snapR(pt){
  if(!geo) return pt;
  const l = loc(pt);
  const magTol = 22 / Math.max(0.4, V.z);

  if(geo.k === 'ruler'){
    // Magnetiza a borde superior (y=0) o borde inferior (y=64) a lo largo de la regla
    if(l.x >= -14 && l.x <= RL + 14){
      const cx = Math.max(0, Math.min(RL, l.x));
      if(Math.abs(l.y) <= magTol) return toWorldFromLocal(cx, -1.5);
      if(Math.abs(l.y - 64) <= magTol) return toWorldFromLocal(cx, 65.5);
    }
  } else if(geo.k === 'protractor'){
    const cx0 = PR, cy0 = PR;
    const dx = l.x - cx0, dy = l.y - cy0, r = Math.hypot(dx, dy);
    // Magnetiza al arco semicircular (0° a 180°)
    if(l.y <= cy0 + 10 && Math.abs(r - PR) <= magTol){
      let ang = Math.atan2(l.y - cy0, l.x - cx0);
      if(ang > 0) ang = (Math.abs(l.x - cx0) <= PR) ? (l.x < cx0 ? -Math.PI : 0) : ang;
      const sx = cx0 + Math.cos(ang) * PR;
      const sy = cy0 + Math.sin(ang) * PR;
      return toWorldFromLocal(sx, sy);
    }
    // Magnetiza a la base recta del transportador
    if(Math.abs(l.y - cy0) <= magTol && l.x >= cx0 - PR - 10 && l.x <= cx0 + PR + 10){
      const sx = Math.max(cx0 - PR, Math.min(cx0 + PR, l.x));
      return toWorldFromLocal(sx, cy0);
    }
  } else if(geo.k === 'tri'){
    // Magnetiza a los 3 lados de la escuadra: (0,0)-(TLN,0), (0,0)-(0,TLN) y (TLN,0)-(0,TLN)
    const edges = [
      [0, 0, TLN, 0],
      [0, 0, 0, TLN],
      [TLN, 0, 0, TLN]
    ];
    let best = null;
    for(const [x1, y1, x2, y2] of edges){
      const prj = projectToSegmentLocal(l.x, l.y, x1, y1, x2, y2);
      if(prj.dist <= magTol && (!best || prj.dist < best.dist)) best = prj;
    }
    if(best) return toWorldFromLocal(best.x, best.y);
  }
  return pt;
}

function openNote(n){cur=n;pi=0;sel=[];selAngle=0;geo=null;subOpen=!compact();_noteDirty=false;n.updated=Date.now();persist();$('#home').classList.add('hide');$('#ed').classList.remove('hide');setTitle();setTool('pen',false);size();center();thumbs()}
function goHome(){
  commitText();
  if($('#spop'))$('#spop').style.display='none';
  persist();
  const hadEdits=_noteDirty&&cur;
  const noteCopy=cur;
  _noteDirty=false;
  $('#ed').classList.add('hide');
  $('#home').classList.remove('hide');
  cur=null;
  homeRender();
  if(hadEdits){
    askSaveBeforeExit(noteCopy);
  }
}

 if(!cur){if((e.ctrlKey||e.metaKey)&&e.key=='f'){e.preventDefault();$('#srch').focus()}return}
 if(document.activeElement==tx||/INPUT|SELECT/.test(document.activeElement.tagName)&&document.activeElement.type!='range')return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
 if(e.code=='Space'){space=1;e.preventDefault()}else if(m&&k=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(m&&k=='y'){e.preventDefault();redo()}else if(m&&k=='n'){e.preventDefault();addPage()}else if(m&&k=='c'&&sel.length){e.preventDefault();clip=JSON.parse(JSON.stringify(sel,R));sub();render()}else if(m&&k=='v'&&clip.length){e.preventDefault();pasteSelection(24,24)}else if(m&&k=='d'){e.preventDefault();selAct('dup')}
 else if(k=='delete'||k=='backspace')selAct('del');else if(k=='0')center();else if(k=='escape'){sel=[];selAngle=0;closeMenu();subOpen=false;sub();render()}
 else if(k=='['||k==']'){const d=k=='['?-1:1;if(tool=='eraser'){er=Math.max(4,Math.min(120,er+d*4));sub()}else{th=Math.max(1,Math.min(24,th+d));sub()}render()}
 else if(!m&&KEYS[k])setTool(KEYS[k],true)});

function saveAllJSON(){
  if(!DB.notes||!DB.notes.length)return;
  const payload={app:'VellumNotesWeb',version:2,notes:DB.notes};
  const name=(cur&&cur.title?cur.title:'VellumNotes_respaldo')+'.json';
  dl(URL.createObjectURL(new Blob([JSON.stringify(payload,R,1)],{type:'application/json'})),name);
}
function hasUnsavedWork(){
  if(_dirty||_noteDirty||cur)return true;
  return Array.isArray(DB.notes)&&DB.notes.some(n=>!n.bin&&(n.pages||[]).some(p=>(p.strokes&&p.strokes.length)||(p.shapes&&p.shapes.length)||(p.texts&&p.texts.length)||(p.images&&p.images.length)));
}
let _exitPromptT=null;
function askSaveBeforeExit(targetNote=null){
  if($('.exit-save-mod'))return;
  const active=targetNote||cur;
  const o=document.createElement('div');
  o.className='ov exit-save-mod';
  o.innerHTML=`<div class="mod"><h3>¿Guardar copia antes de salir?</h3><p style="color:var(--sl);line-height:1.45">Has editado tus apuntes. Aunque se guardan en este navegador, puedes descargar un archivo <b>.json</b> de respaldo ahora.</p><div class="mod-act"><button class="gh" id="exno">No descargar</button><button class="pri" id="exyes">Descargar .json</button></div></div>`;
  const close=()=>o.remove();
  o.onclick=e=>{if(e.target===o)close();};
  o.querySelector('#exno').onclick=close;
  o.querySelector('#exyes').onclick=()=>{
    if(active){
      dl(URL.createObjectURL(new Blob([JSON.stringify({app:'VellumNotesWeb',version:2,notes:[active]},R,1)],{type:'application/json'})),(active.title||'nota')+'.json');
    }else{
      saveAllJSON();
    }
    close();
  };
  document.body.append(o);
}
addEventListener('beforeunload',e=>{
  if(!hasUnsavedWork())return;
  clearTimeout(_exitPromptT);
  _exitPromptT=setTimeout(()=>askSaveBeforeExit(cur),100);
  e.preventDefault();
  e.returnValue='Recuerda guardar tu cuaderno como .json antes de cerrar.';
  return e.returnValue;
});

 fl.addEventListener('contextmenu',()=>{fired=true},true);

  t=setTimeout(()=>{if(!fired){fired=true;b.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:x,clientY:y}))}},550)});
 ['pointerup','pointercancel'].forEach(ev=>fl.addEventListener(ev,()=>clearTimeout(t)));
 fl.addEventListener('click',e=>{if(fired){e.stopPropagation();e.preventDefault();fired=false}},true)})();
